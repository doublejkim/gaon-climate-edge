# 디바이스 종류입니다. claim 등록 요청의 name/type 값으로 그대로 사용됩니다.
# 현재 가능한 값: TEMP_HUMIDITY, MIC
type: TEMP_HUMIDITY

# DHT22 온습도 센서 설정입니다.
sensor:
  # DHT22 데이터 핀입니다. board 모듈의 핀 이름을 그대로 사용합니다(예: D4는 GPIO4).
  board_pin: D4
  # 라즈베리파이 계열 SBC에서는 pulseio 미사용(False)을 권장합니다.
  use_pulseio: false

# 센서 수집 주기 설정입니다. 소프트웨어 타이머로 동작합니다.
collection:
  # 온습도 값을 수집하는 주기입니다. 60초는 1분마다 수집한다는 의미입니다.
  interval_seconds: 60
  # 센서 읽기에 실패했을 때 최대 재시도 횟수입니다.
  retry_limit: 3
  # 재시도 사이에 대기할 시간입니다.
  retry_delay_seconds: 2

# 서버 API 경로 설정입니다. 실제 서버 주소와 인증키는 config/.env에서 관리합니다.
server:
  # 온습도 전송 API 경로입니다. {device_key}는 .env의 device_key 값으로 치환됩니다.
  climate_endpoint: /climate/{device_key}
  # claim code로 디바이스를 등록할 API 경로입니다.
  claim_endpoint: /devices/claim

# 로그 파일 운영 설정입니다.
logging:
  # 로그 파일 보관 기간입니다. 7은 7일 보관을 의미합니다.
  retention_days: 7

# 디바이스 등록 요청에 사용할 정보입니다.
device:
  # claim 등록 요청의 location_name 값으로 전송됩니다.
  location_name: 우리집
