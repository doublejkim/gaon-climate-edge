services:
  climate-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gaon-climate-edge:latest
    container_name: gaon-climate-edge
    restart: on-failure
    volumes:
      # config/.env에 api_key/device_key를 기록하므로 읽기/쓰기로 마운트합니다.
      - ${APP_CONFIG_DIR:-../config}:/app/config
      - ${APP_LOG_DIR:-../log}:/app/log
      - /etc/localtime:/etc/localtime:ro
    privileged: true
    devices:
      # DHT22는 GPIO(libgpiod)로 통신합니다. gpiochip0 접근이 필요합니다.
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
      - /dev/gpiochip0:/dev/gpiochip0
    command: ["--mode", "${CLIMATE_MODE:-run}"]
